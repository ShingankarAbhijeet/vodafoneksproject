name: Terraform CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - abz

jobs:
  plan:
    environment: dev
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::314133462348:role/github-actions-prod
          aws-region: us-east-1
          role-duration-seconds: 3600

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Init
        run: terraform init

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: dev   # 👈 IMPORTANT

    permissions:
      id-token: write
      contents: read
    env:
      CLUSTER_NAME: "example"
      AWS_REGION: "us-east-1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::314133462348:role/github-actions-prod
          aws-region: us-east-1
          role-duration-seconds: 900

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Init
        run: terraform init

      - name: Apply
        run: terraform apply -auto-approve tfplan
      - name: Upload errored state (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: errored-tfstate
          path: errored.tfstate
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION
      - name: wait for node
        run: |
          kubectl get nodes
          sleep 30

      - name: Install ArgoCD
        run: |
          kubectl create namespace argocd || true
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            -f helm-charts/values/argocd-values.yaml
      

      - name: Upload errored state (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
              name: errored-tfstate
              path: errored.tfstate